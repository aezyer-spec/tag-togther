<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Tag Together</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#142016;color:white;font-family:system-ui,sans-serif}body{touch-action:none}canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.panel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#111827e8;z-index:10}.card{width:min(92vw,430px);padding:28px;border:3px solid white;border-radius:18px;background:#25213b;text-align:center;box-shadow:0 10px #090b12}h1{margin:0 0 8px}p{opacity:.85}input,button{width:100%;height:50px;margin-top:10px;border:0;border-radius:12px;font:700 16px system-ui}input{text-align:center;text-transform:uppercase;letter-spacing:3px}button{background:#7ee787}button.secondary{background:#8ab4ff}#status{min-height:24px;margin-top:12px;color:#ffd866}#hud{position:fixed;top:10px;left:0;right:0;display:none;justify-content:center;z-index:5;pointer-events:none}.hud{background:#111827dd;border:2px solid #ffffff55;border-radius:12px;padding:7px 15px;text-align:center}#toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.8);opacity:0;font-size:36px;font-weight:1000;z-index:8;text-shadow:4px 4px #111827;transition:.15s}#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}#joy{display:none;position:fixed;left:22px;bottom:22px;width:132px;height:132px;border-radius:50%;border:3px solid #ffffff55;background:#ffffff18;z-index:6}#stick{position:absolute;left:34px;top:34px;width:58px;height:58px;border-radius:50%;background:#ffffff88;border:3px solid white}@media(pointer:coarse){#joy{display:block}}</style></head><body>
<canvas id="game"></canvas><div id="menu" class="panel"><div class="card"><h1>💗 TAG TOGETHER</h1><p>Chase each other through a cozy pixel garden. First to <b>5 tags</b> wins.</p><button id="create">Create Room</button><input id="code" maxlength="8" placeholder="ROOM CODE"><button id="join" class="secondary">Join Room</button><div id="status"></div></div></div><div id="hud"><div class="hud"><div id="room"></div><b id="role"></b><div id="score"></div></div></div><div id="toast"></div><div id="joy"><div id="stick"></div></div>
<script src="/socket.io/socket.io.js"></script><script>
const C=document.getElementById("game"),X=C.getContext("2d"),S=io(),B=new Image(),G=new Image();B.src="/assets/boy.png";G.src="/assets/girl.png";let me=null,state=null,keys={},joy={x:0,y:0},drag=false;
function rs(){C.width=innerWidth;C.height=innerHeight}addEventListener("resize",rs);rs();
function start(d){me=d.playerId;state=d.state;menu.style.display="none";hud.style.display="flex";room.textContent="ROOM "+d.room}
create.onclick=()=>{status.textContent="Creating room…";S.emit("createRoom")};join.onclick=()=>{let q=code.value.trim().toUpperCase();if(!q)return status.textContent="Enter a room code.";status.textContent="Joining…";S.emit("joinRoom",q)};
S.on("roomCreated",start);S.on("joined",start);S.on("state",q=>state=q);S.on("errorMessage",q=>status.textContent=q);S.on("tag",()=>pop("✨ TAG!"));S.on("roundOver",q=>pop(q.winner===me?"💗 YOU WIN!":"💫 THEY WIN!"));
function pop(t){toast.textContent=t;toast.classList.add("show");setTimeout(()=>toast.classList.remove("show"),500);if(navigator.vibrate)navigator.vibrate([30,40,80])}
addEventListener("keydown",e=>keys[e.key.toLowerCase()]=1);addEventListener("keyup",e=>keys[e.key.toLowerCase()]=0);
function jm(e){let r=joyel.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,m=48,d=Math.hypot(dx,dy);if(d>m){dx=dx/d*m;dy=dy/d*m}joy.x=dx/m;joy.y=dy/m;stick.style.transform=`translate(${dx}px,${dy}px)`}
const joyel=document.getElementById("joy"),stick=document.getElementById("stick");joyel.onpointerdown=e=>{drag=true;joyel.setPointerCapture(e.pointerId);jm(e)};joyel.onpointermove=e=>drag&&jm(e);joyel.onpointerup=joyel.onpointercancel=()=>{drag=false;joy={x:0,y:0};stick.style.transform="translate(0,0)"};
function inp(){let x=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joy.x,y=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+joy.y,d=Math.hypot(x,y);if(d>1){x/=d;y/=d}return{x,y}}setInterval(()=>{if(me)S.emit("move",inp())},33);
function rr(x,y,w,h,r){X.beginPath();X.roundRect(x,y,w,h,r);X.fill()}function tree(x,y,z=1){X.fillStyle="#513724";X.fillRect(x-7*z,y+15*z,14*z,28*z);X.fillStyle="#234f36";X.beginPath();X.arc(x,y,31*z,0,7);X.fill();X.fillStyle="#326441";X.beginPath();X.arc(x-13*z,y-11*z,19*z,0,7);X.fill()}
function env(a){X.fillStyle="#557a45";X.fillRect(a.x,a.y,a.w,a.h);for(let y=0;y<a.h;y+=32)for(let q=0;q<a.w;q+=32){X.fillStyle=((q/32+y/32)%2)?"#5b8149":"#527643";X.fillRect(a.x+q,a.y+y,32,32)}X.fillStyle="#b8915a";rr(a.x+a.w*.39,a.y+a.h*.45,a.w*.4,a.h*.18,9);rr(a.x+a.w*.48,a.y+a.h*.12,a.w*.15,a.h*.7,9);X.fillStyle="#334b45";rr(a.x+a.w*.72,a.y+a.h*.16,a.w*.2,a.h*.34,18);X.fillStyle="#3b7d8b";rr(a.x+a.w*.735,a.y+a.h*.18,a.w*.17,a.h*.3,14);X.fillStyle="#744728";rr(a.x+a.w*.7,a.y+a.h*.35,a.w*.24,a.h*.09,5);for(let i=0;i<6;i++){X.fillStyle="#a66f3b";X.fillRect(a.x+a.w*.705+i*a.w*.038,a.y+a.h*.355,a.w*.027,a.h*.075)}[[.08,.14],[.22,.2],[.89,.11],[.12,.78],[.9,.74],[.29,.84],[.79,.84]].forEach(p=>tree(a.x+p[0]*a.w,a.y+p[1]*a.h,.9));[[.19,.34],[.59,.85]].forEach(p=>{let q=a.x+p[0]*a.w,r=a.y+p[1]*a.h;X.fillStyle="#704627";X.fillRect(q-35,r-7,70,10);X.fillRect(q-35,r+8,70,8)});[[.34,.27],[.65,.29],[.94,.57],[.37,.71],[.68,.71]].forEach(p=>{X.fillStyle="#77705d";X.beginPath();X.arc(a.x+p[0]*a.w,a.y+p[1]*a.h,10,0,7);X.fill()});X.strokeStyle="#344d35";X.lineWidth=8;X.strokeRect(a.x,a.y,a.w,a.h)}
function player(p,a,ism){let q=a.x+p.x*a.w,r=a.y+p.y*a.h,img=p.skin==="girl"?G:B,ok=img.complete&&img.naturalWidth,w=Math.min(130,a.w*.13),h=ok?w*img.naturalHeight/img.naturalWidth:80;if(p.id===state.chaser){X.beginPath();X.arc(q,r,32,0,7);X.fillStyle="#ff6b9d20";X.fill();X.strokeStyle="#ff91b6";X.lineWidth=3;X.stroke()}if(ok)X.drawImage(img,q-w/2,r-h*.7,w,h);if(ism){X.strokeStyle="#fff";X.lineWidth=2;X.strokeRect(q-w/2-5,r-h*.7-5,w+10,h+10)}X.font="900 12px system-ui";X.textAlign="center";X.fillStyle="#fff";X.fillText(ism?"YOU":(p.id===state.chaser?"CHASE!":"RUN!"),q,r+45)}
function draw(){requestAnimationFrame(draw);X.fillStyle="#101820";X.fillRect(0,0,C.width,C.height);if(!state)return;let a={x:18,y:68,w:C.width-36,h:C.height-92};env(a);Object.values(state.players||{}).forEach(p=>player(p,a,p.id===me));role.textContent=state.chaser===me?"💗 YOU ARE CHASING":"🏃 YOU ARE RUNNING";score.textContent=`Tags: ${state.scores?.[me]||0} / 5`}draw();
</script></body></html>
